name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNG icons from base64
        run: |
          mkdir -p icons
          base64 -d icons/icon-180.png.b64 > icons/icon-180.png
          base64 -d icons/icon-192.png.b64 > icons/icon-192.png
          base64 -d icons/icon-512.png.b64 > icons/icon-512.png
          file icons/*.png
          rm -f icons/*.b64
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
